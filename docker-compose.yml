services:
  mcp-server:
    build: .
    restart: unless-stopped
    container_name: contact-mcp-server
    environment:
      - MCP_DEBUG=false
      # Comma-separated: this VPS's public IP, its domain, or both — must
      # match the site blocks in Caddyfile.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?set ALLOWED_HOSTS to this server's public IP and/or domain}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-120}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - contacts-data:/data
    expose:
      - "8008"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80/443 already taken by another reverse proxy on this host (nginx_https).
      # Using 8080/8443 instead — see README for what this means for HTTPS.
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp-server

volumes:
  contacts-data:
  caddy-data:
  caddy-config:
